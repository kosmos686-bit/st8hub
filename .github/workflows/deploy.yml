name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify static Pages files
        shell: bash
        run: |
          for file in index.html login.html st8-dark.html; do
            test -s "st8-dark/frontend/out/$file" || {
              echo "::error::Missing or empty Pages file: $file"
              exit 1
            }
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./st8-dark/frontend/out
          destination_dir: st8-dark

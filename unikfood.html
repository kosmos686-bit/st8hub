<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unikfood | CHEFF AI Технолог</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C8F53C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Unikfood">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
<style>
:root {
  --accent: #C8F53C;
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1e1e1e;
  --surface3: #252525;
  --border: rgba(255,255,255,0.08);
  --text: #f0f0f0;
  --text-muted: rgba(240,240,240,0.45);
  --text-dim: rgba(240,240,240,0.2);
  --radius: 12px;
  --font: 'Inter', sans-serif;
  --header-h: 60px;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
body { background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

/* ── ONBOARDING ── */
#onboarding { min-height: 100vh; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
.ob-logo { font-size: 2rem; font-weight: 900; letter-spacing: -.03em; margin-bottom: .25rem; }
.ob-logo span { color: var(--accent); }
.ob-sub { font-size: .7rem; letter-spacing: .2em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2rem; }
.ob-steps { display: flex; gap: .5rem; margin-bottom: 2rem; }
.ob-step { width: 32px; height: 3px; background: var(--border); border-radius: 2px; transition: background .3s; }
.ob-step.active { background: var(--accent); }
.ob-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.75rem; width: 100%; max-width: 560px; }
.ob-title { font-size: 1.05rem; font-weight: 700; margin-bottom: .4rem; }
.ob-desc { font-size: .78rem; color: var(--text-muted); margin-bottom: 1.25rem; }
.vert-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.vert-card { border: 1.5px solid var(--border); border-radius: var(--radius); padding: .875rem; cursor: pointer; transition: all .2s; }
.vert-card:hover, .vert-card.selected { border-color: var(--accent); background: rgba(212,175,55,.07); }
.vc-icon { font-size: 1.4rem; margin-bottom: .4rem; }
.vc-name { font-size: .82rem; font-weight: 600; }
.vc-sub { font-size: .68rem; color: var(--text-muted); margin-top: .15rem; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
@media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } .vert-grid { grid-template-columns: 1fr; } }
.field { display: flex; flex-direction: column; gap: .35rem; }
.field label { font-size: .68rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; }
.field input, .field select, .field textarea {
  background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
  padding: .55rem .75rem; color: var(--text); font-size: .85rem; outline: none; transition: border-color .2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field input[type=color] { height: 38px; padding: 3px; cursor: pointer; }
.field-full { grid-column: 1 / -1; }
.field select option { background: var(--surface2); }
.btn { padding: .65rem 1.4rem; border-radius: 8px; font-size: .85rem; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
.btn-accent { background: var(--accent); color: #0a0a0a; }
.btn-accent:hover { filter: brightness(1.1); }
.btn-outline { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); }
.btn-outline:hover { background: rgba(212,175,55,.1); }
.btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface3); }
.btn-danger { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.25); }
.btn-danger:hover { background: rgba(239,68,68,.2); }
.ob-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 1.25rem; gap: 1rem; }
.crm-panel { border: 1px dashed rgba(255,255,255,.12); border-radius: 10px; padding: 1.1rem; margin-top: .75rem; }
.crm-panel .cpt { font-size: .75rem; font-weight: 700; color: var(--accent); margin-bottom: .75rem; text-transform: uppercase; letter-spacing: .08em; }
.drop-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 1.75rem; text-align: center; cursor: pointer; transition: border-color .2s; }
.drop-zone:hover { border-color: var(--accent); }
.drop-zone p { font-size: .8rem; color: var(--text-muted); }

/* ── APP ── */
#app { display: none; min-height: 100vh; flex-direction: column; }
header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,10,10,.92); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  height: var(--header-h); display: flex; align-items: center;
  padding: 0 1rem; gap: .75rem;
}
.hd-brand { display: flex; flex-direction: column; min-width: 70px; flex-shrink: 0; }
.hd-logo { font-size: .82rem; font-weight: 900; letter-spacing: -.01em; }
.hd-logo span { color: var(--accent); }
.hd-venue { font-size: .62rem; color: var(--accent); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
@media (min-width: 768px) { .hd-venue { max-width: 160px; } }
.tab-nav { flex: 1; display: flex; align-items: center; justify-content: flex-start; gap: .15rem; overflow-x: auto; scrollbar-width: none; }
.tab-nav::-webkit-scrollbar { display: none; }
.tab-btn { display: flex; align-items: center; gap: .3rem; padding: .375rem .6rem; border-radius: 8px; border: none; background: transparent; color: var(--text-muted); font-size: .75rem; font-weight: 500; cursor: pointer; transition: all .2s; white-space: nowrap; }
.tab-btn:hover { color: var(--text); background: var(--surface2); }
.tab-btn.active { color: var(--accent); background: rgba(212,175,55,.1); }
.tab-btn .ti { font-size: .95rem; }
.tab-btn .tl { display: none; }
@media (min-width: 768px) { .tab-btn .tl { display: inline; } }
.hd-right { display: flex; align-items: center; gap: .6rem; flex-shrink: 0; }
.cheff-status { font-size: .65rem; color: #22c55e; white-space: nowrap; display: none; }
@media (min-width: 640px) { .cheff-status { display: block; } }
.settings-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: .95rem; display: flex; align-items: center; justify-content: center; transition: background .2s; color: var(--text-muted); }
.settings-btn:hover { background: var(--surface3); color: var(--text); }
.content { flex: 1; padding: 1rem; max-width: 1280px; width: 100%; margin: 0 auto; }
@media (min-width: 768px) { .content { padding: 1.5rem; } }
@media (min-width: 1280px) { .content { padding: 2rem; } }

/* ── GREETING ── */
.greeting-card {
  background: linear-gradient(135deg, var(--surface), var(--surface2));
  border: 1px solid rgba(212,175,55,.18); border-radius: 14px;
  padding: .9rem 1.1rem; margin-bottom: 1.1rem;
  display: flex; align-items: flex-start; gap: .65rem;
}
.gc-avatar { width: 34px; height: 34px; background: rgba(212,175,55,.12); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
.gc-text { font-size: .83rem; color: var(--text-muted); line-height: 1.5; }
.gc-text strong { color: var(--text); font-weight: 600; }

/* ── TABS ── */
.tab-panel { display: none; animation: fadeIn .25s ease; }
.tab-panel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

/* ── CHAT ── */
.chat-scenarios { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: .9rem; padding-bottom: .2rem; }
.chat-scenarios::-webkit-scrollbar { display: none; }
.scenario-btn { flex-shrink: 0; padding: .35rem .8rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; font-size: .72rem; color: var(--text-muted); cursor: pointer; transition: all .2s; white-space: nowrap; }
.scenario-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(212,175,55,.06); }
.chat-messages { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; min-height: 280px; max-height: 440px; overflow-y: auto; padding: .9rem; display: flex; flex-direction: column; gap: .65rem; margin-bottom: .65rem; }
.msg { display: flex; gap: .55rem; max-width: 88%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar { width: 26px; height: 26px; border-radius: 50%; background: rgba(212,175,55,.12); display: flex; align-items: center; justify-content: center; font-size: .75rem; flex-shrink: 0; margin-top: 2px; }
.msg.user .msg-avatar { background: var(--surface3); }
.msg-bubble { background: var(--surface2); border-radius: 12px; padding: .55rem .85rem; font-size: .83rem; line-height: 1.55; }
.msg.user .msg-bubble { background: rgba(212,175,55,.13); }
.msg-actions { display: flex; gap: .35rem; margin-top: .35rem; flex-wrap: wrap; }
.ma-btn { padding: .22rem .55rem; border-radius: 6px; font-size: .67rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); transition: all .2s; }
.ma-btn:hover { border-color: var(--accent); color: var(--accent); }
.thinking { font-size: .78rem; color: var(--text-dim); font-style: italic; padding: .5rem .85rem; }
.chat-input-area { display: flex; gap: .45rem; }
.chat-input-area textarea { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .6rem .8rem; color: var(--text); font-size: .85rem; resize: none; outline: none; transition: border-color .2s; min-height: 46px; max-height: 110px; line-height: 1.4; }
.chat-input-area textarea:focus { border-color: var(--accent); }
.send-btn { background: var(--accent); color: #0a0a0a; border: none; border-radius: 10px; width: 46px; height: 46px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: filter .2s; font-weight: 700; }
.send-btn:hover { filter: brightness(1.1); }
.warn-bar { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25); border-radius: 8px; padding: .65rem .9rem; font-size: .78rem; color: #fca5a5; margin-bottom: .65rem; }

/* ── SECTION ── */
.sec-hd { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-bottom: 1.1rem; flex-wrap: wrap; }
.sec-hd h2 { font-size: 1.05rem; font-weight: 700; }

/* ── TABLE ── */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: .8rem; }
th { padding: .55rem .7rem; background: var(--surface); text-align: left; font-size: .67rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); }
td { padding: .55rem .7rem; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.45; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,.02); }
.badge { display: inline-block; padding: .18rem .48rem; border-radius: 5px; font-size: .66rem; font-weight: 600; }
.badge-green { background: rgba(34,197,94,.13); color: #86efac; }
.badge-yellow { background: rgba(234,179,8,.13); color: #fde047; }
.badge-red { background: rgba(239,68,68,.13); color: #fca5a5; }
.badge-accent { background: rgba(212,175,55,.13); color: var(--accent); }
.cheff-tip { font-size: .7rem; color: var(--accent); line-height: 1.4; font-style: italic; }

/* ── CARDS ── */
.card-grid { display: grid; grid-template-columns: 1fr; gap: .9rem; }
@media (min-width: 600px) { .card-grid { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; }
.card h3 { font-size: .87rem; font-weight: 700; margin-bottom: .45rem; }
.card p { font-size: .76rem; color: var(--text-muted); line-height: 1.5; }

/* ── ROI ── */
.roi-grid { display: grid; grid-template-columns: 1fr; gap: 1.1rem; }
@media (min-width: 768px) { .roi-grid { grid-template-columns: 1fr 1fr; } }
.roi-result { background: var(--surface); border: 1px solid rgba(212,175,55,.22); border-radius: 14px; padding: 1.4rem; }
.roi-total { font-size: 2rem; font-weight: 900; color: var(--accent); margin: .4rem 0; }
.roi-row { display: flex; justify-content: space-between; align-items: center; padding: .45rem 0; border-bottom: 1px solid var(--border); font-size: .8rem; }
.roi-row:last-child { border-bottom: none; }
.roi-row .rv { font-weight: 700; color: var(--accent); }
.slider-field { margin-bottom: .9rem; }
.slider-field label { font-size: .73rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: .35rem; }
.slider-field input[type=range] { width: 100%; accent-color: var(--accent); }

/* ── MODAL ── */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding: 1rem; overflow-y: auto; }
.modal-bg.hidden { display: none; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; width: 100%; max-width: 580px; margin: auto; overflow-x: hidden; word-break: break-word; }
.modal-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.1rem; }
.modal-hd h2 { font-size: .95rem; font-weight: 700; }
.close-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; width: 28px; height: 28px; cursor: pointer; font-size: .9rem; color: var(--text-muted); line-height: 1; transition: all .2s; }
.close-btn:hover { color: var(--text); background: var(--surface3); }
.mem-list { display: flex; flex-direction: column; gap: .3rem; max-height: 110px; overflow-y: auto; margin-bottom: .4rem; }
.mem-item { display: flex; justify-content: space-between; align-items: flex-start; gap: .4rem; background: var(--surface2); border-radius: 6px; padding: .35rem .55rem; font-size: .72rem; }
.mem-del { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: .85rem; padding: 0 .15rem; }
.mem-del:hover { color: #ef4444; }
.mem-section { margin-top: .9rem; }
.mem-section h4 { font-size: .7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: .4rem; }
.divider { height: 1px; background: var(--border); margin: 1.1rem 0; }

/* ── CHARTS ── */
.chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; margin-bottom: 1.1rem; }
.chart-title { font-size: .82rem; font-weight: 600; margin-bottom: .75rem; }
.chart-toggle { display: flex; gap: .3rem; margin-bottom: .65rem; }
.ct-btn { padding: .28rem .65rem; border-radius: 6px; font-size: .7rem; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); transition: all .2s; }
.ct-btn.active { background: rgba(212,175,55,.12); border-color: var(--accent); color: var(--accent); }
.ct-btn:hover { border-color: rgba(212,175,55,.5); color: rgba(212,175,55,.7); }

/* ── SEARCH ── */
.search-bar { display: flex; gap: .5rem; margin-bottom: .9rem; }
.search-bar input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .8rem; color: var(--text); font-size: .83rem; outline: none; }
.search-bar input:focus { border-color: var(--accent); }

/* ── REPORT ── */
.report-area { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; font-size: .82rem; line-height: 1.7; color: var(--text-muted); min-height: 180px; white-space: pre-wrap; font-family: 'Inter', monospace; }

/* ── SOURCE TABS ── */
.source-tabs { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .75rem; }

/* ── MISC ── */
.gap-sm { display: flex; gap: .5rem; flex-wrap: wrap; }
.mt-sm { margin-top: .65rem; }
.mt-md { margin-top: 1.1rem; }
.text-accent { color: var(--accent); }
.text-muted { color: var(--text-muted); }
.text-sm { font-size: .78rem; }
.font-bold { font-weight: 700; }

/* ── SCROLL ── */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

/* ── SPLASH ── */
#splash {
  position: fixed; inset: 0; z-index: 9999;
  background: #0a0a0a;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 0;
  transition: opacity .5s ease;
}
#splash.fade { opacity: 0; pointer-events: none; }
.sp-logo { font-size: 2.6rem; font-weight: 900; letter-spacing: -.04em; margin-bottom: .1rem; }
.sp-logo span { color: #C8F53C; }
.sp-sub { font-size: .65rem; letter-spacing: .25em; color: rgba(240,240,240,.4); text-transform: uppercase; margin-bottom: 2.5rem; }
.sp-bar-wrap { width: 200px; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; margin-bottom: .75rem; }
.sp-bar { height: 100%; width: 0%; background: #C8F53C; border-radius: 2px; transition: width .15s ease; }
.sp-pct { font-size: .75rem; font-weight: 700; color: #C8F53C; letter-spacing: .05em; }
.sp-hint { font-size: .6rem; color: rgba(240,240,240,.25); margin-top: 2rem; letter-spacing: .1em; text-transform: uppercase; }


/* ── FOOTER ── */
.st8-footer {
  text-align: center;
  padding: 1.5rem 1rem 2rem;
  margin-top: 2rem;
  border-top: 1px solid var(--border);
  font-size: .68rem;
  color: var(--text-dim);
  letter-spacing: .06em;
}
.st8-footer span { color: var(--accent); font-weight: 600; }
.st8-footer a { color: var(--text-dim); text-decoration: none; }
.st8-footer a:hover { color: var(--accent); }

#pdf-print { display: none; }

/* ── PRINT ── */
@media print {
  header, .chat-scenarios, .settings-btn, .warn-bar, .gap-sm, .sec-hd button { display: none !important; }
  .report-area { border: none; padding: 0; color: #000; background: #fff; }
  body { background: #fff; color: #000; }
  #pdf-print { display: block !important; }
}
</style>
</head>
<body>


<!-- ════ SPLASH ════ -->
<div id="splash">
  <div class="sp-logo"><span>ST8</span> RESTO</div>
  <div class="sp-sub">Unikfood · CHEFF AI</div>
  <div class="sp-bar-wrap"><div class="sp-bar" id="sp-bar"></div></div>
  <div class="sp-pct" id="sp-pct">0%</div>
  <div class="sp-hint">AI Технолог · Dark Kitchen · Екатеринбург</div>
</div>

<!-- ════ ONBOARDING ════ -->
<div id="onboarding">
  <div class="ob-logo"><span>ST8</span> RESTO</div>
  <div class="ob-sub">Powered by CHEFF · AI Технолог</div>
  <div class="ob-steps">
    <div class="ob-step active" id="st0"></div>
    <div class="ob-step" id="st1"></div>
    <div class="ob-step" id="st2"></div>
  </div>
  <div class="ob-card" id="ob-content"></div>
</div>

<!-- ════ MAIN APP ════ -->
<div id="app">
  <header>
    <div class="hd-brand">
      <div class="hd-logo"><span>ST8</span> RESTO</div>
      <div class="hd-venue" id="hd-venue"></div>
    </div>
    <nav class="tab-nav" id="tab-nav"></nav>
    <div class="hd-right">
      <div class="cheff-status">CHEFF онлайн 🟢</div>
      <button class="settings-btn" onclick="openSettings()" title="Настройки">⚙️</button>
    </div>
  </header>
  <div class="content">
    <div class="greeting-card">
      <div class="gc-avatar">🤖</div>
      <div class="gc-text" id="greeting-text">Загрузка...</div>
    </div>
    <div id="tab-panels"></div>

    <div class="st8-footer">
      Разработано <span>ST8 AI</span> · 2026 ·
      <a href="https://st8-ai.ru" target="_blank">st8-ai.ru</a>
    </div>
  </div>
</div>

<!-- ════ SETTINGS MODAL ════ -->
<div class="modal-bg hidden" id="settings-modal">
  <div class="modal">
    <div class="modal-hd">
      <h2>⚙️ Настройки</h2>
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </div>
    <div id="settings-content"></div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────────────────────
// STORAGE
// ──────────────────────────────────────────────────────────────

function showSplash(onDone) {
  const bar = document.getElementById('sp-bar');
  const pct = document.getElementById('sp-pct');
  const splash = document.getElementById('splash');
  let p = 0;
  const steps = [
    [300, 30, 'Загрузка данных...'],
    [200, 60, 'Инициализация CHEFF...'],
    [200, 85, 'Подключение AI...'],
    [150, 100, 'Готово']
  ];
  let i = 0;
  function next() {
    if (i >= steps.length) {
      setTimeout(() => {
        splash.classList.add('fade');
        setTimeout(() => { splash.style.display = 'none'; onDone(); }, 500);
      }, 200);
      return;
    }
    const [delay, target] = steps[i++];
    const inc = (target - p) / (delay / 16);
    const tick = setInterval(() => {
      p = Math.min(p + inc, target);
      bar.style.width = p + '%';
      pct.textContent = Math.round(p) + '%';
      if (p >= target) { clearInterval(tick); setTimeout(next, 80); }
    }, 16);
  }
  next();
}

  const last=bracList[bracList.length-1];

      bar.className='warn-bar';
      bar.style.cssText='position:fixed;top:60px;left:0;right:0;z-index:9999;margin:0 1rem;text-align:center;cursor:pointer';

      setTimeout(()=>bar.remove(),8000);
    },2000);
  }
}

async function checkWeeklyReport(){
  const now=new Date();
  if(now.getDay()!==1) return;
  const today=now.toISOString().slice(0,10);
  if(S.raw('unik_weekly_gen')===today) return;
  const apiKey=S.raw('st8_api_key'); if(!apiKey) return;
  S.setRaw('unik_weekly_gen',today);
  const data30=analyticsData.slice(-7);
  if(!data30.length) return;
  const summary=data30.map(d=>`${d.date}: ${d.revenue}₽`).join(', ');
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,system:sysPrompt(),messages:[{role:'user',content:`Еженедельный отчёт за прошлую неделю. Данные: ${summary}. Дай краткий итог и 3 задачи на эту неделю. Без markdown.`}]})});
    const d=await resp.json();
    const txt=d.content?.[0]?.text||'';
    if(!txt) return;
    setTimeout(()=>{
      let m=document.getElementById('weekly-modal');
      if(!m){m=document.createElement('div');m.className='modal-bg';m.id='weekly-modal';document.body.appendChild(m);}
      m.innerHTML=`<div class="modal" style="max-width:540px">
        <div class="modal-hd"><h2>📊 Еженедельный отчёт CHEFF</h2><button class="close-btn" onclick="document.getElementById('weekly-modal').classList.add('hidden')">✕</button></div>
        <div style="font-size:.8rem;line-height:1.7;color:var(--text-muted);white-space:pre-wrap;padding:.75rem;background:var(--surface2);border-radius:8px;max-height:60vh;overflow-y:auto">${H(txt)}</div>
        <div class="gap-sm mt-sm"><button class="btn btn-accent" onclick="document.getElementById('weekly-modal').classList.add('hidden')">Понял, работаем!</button></div>
      </div>`;
      m.classList.remove('hidden');
    },3000);
  }catch{}
}

function buildGreeting() {
  const d=new Date(), day=d.getDay(), h=d.getHours();

  let tip;
  if (day===1) tip='Начнём неделю с плана. Проверим фудкост?';
  else if (day===5) tip='Аншлаг на выходных — готов помочь с графиком.';
  else if (h>=6&&h<10) tip='Чек-лист открытия смены готов.';
  else if (h>=20&&h<23) tip='Подведём итоги дня?';
  else if (mem.wins.length) tip=`Помню: ${mem.wins[mem.wins.length-1]}`;
  else tip='Готов помочь — задай вопрос или выбери сценарий ниже.';

  document.getElementById('greeting-text').innerHTML = `<strong>Привет, ${fname}!</strong> Я CHEFF. Сегодня ${days[day]}. ${tip}`;

const A = s => String(s).replace(/'/g,"\\'").replace(/\n/g,' ');

function renderMsgs() {
  if (!chatHistory.length) return '<div style="color:var(--text-dim);font-size:.8rem;text-align:center;padding:2rem">Начните диалог с CHEFF</div>';
  return chatHistory.map((m,i)=>{
    const isUser=m.role==='user';
    const isLast=!isUser&&i===chatHistory.length-1;
    return `<div class="msg ${isUser?'user':''}">
      <div class="msg-avatar">${isUser?'👤':'🤖'}</div>
      <div>
        <div class="msg-bubble">${(()=>{const raw=String(m.content||'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g,'');const isTTK=/ТЕХНОЛОГИЧЕСКАЯ КАРТА|РЕЦЕПТУРА|ТЕХНОЛОГИЯ ПРИГОТОВЛЕНИЯ/i.test(raw);return H(isTTK?raw:(raw.length>500?raw.slice(0,500)+'... (показано начало)':raw));})()}</div>
        ${!isUser?`<div class="msg-actions">
          ${isLast?`<button class="ma-btn" onclick="memFb('win',${i})">✅ Сработало</button>
          <button class="ma-btn" onclick="memFb('fail',${i})">❌ Не подходит</button>
          <button class="ma-btn" onclick="memFb('note',${i})">📝 Заметка</button>`:''}
          <button class="ma-btn" style="border-color:var(--accent);color:var(--accent)" onclick="saveTTKFromChat(${i})">📋 Сохранить в ТТК</button>
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

function saveTTKFromChat(idx) {
  const m = chatHistory[idx]; if (!m || m.role !== 'assistant') return;
  const name = prompt('Название ТТК:', '');
  if (!name) return;
  const txt = m.content;
  const fc = (txt.match(/фудкост[:\s]+(\d+(?:\.\d+)?)/i)||txt.match(/(\d+(?:\.\d+)?)\s*%\s*(?:фудкост|себестоимость)/i)||[])[1]||0;
  const yld = (txt.match(/выход[:\s]+(\d+\s*г)/i)||txt.match(/(\d+\s*г)\s*(?:выход|порция)/i)||[])[1]||'';
  const kcal = (txt.match(/(\d+)\s*ккал/i)||[])[1]||0;
  const prot = (txt.match(/белок[:\s]+(\d+(?:\.\d+)?)/i)||txt.match(/Б\s*(\d+(?:\.\d+)?)/)||[])[1]||0;
  const fat = (txt.match(/жир[:\s]+(\d+(?:\.\d+)?)/i)||txt.match(/Ж\s*(\d+(?:\.\d+)?)/)||[])[1]||0;
  const carbs = (txt.match(/углевод[:\s]+(\d+(?:\.\d+)?)/i)||txt.match(/У\s*(\d+(?:\.\d+)?)/)||[])[1]||0;
  ttkList.push({name, foodcost:+fc||0, yield:yld, kcal:+kcal||0, protein:+prot||0, fat:+fat||0, carbs:+carbs||0, fullText:txt, status:'draft', at:new Date().toISOString()});
  S.set('unik_ttk', ttkList);
  validatePP(ttkList[ttkList.length-1]);
  alert('✅ Сохранено в ТТК: ' + name);
}

function scrollChat() {
  const el=document.getElementById('chat-msgs');
  if(el) el.scrollTop=el.scrollHeight;
}

function sendMsg() {
  const inp=document.getElementById('chat-inp');
  if(!inp) return;
  const t=inp.value.trim();
  if(!t) return;
  inp.value=''; inp.style.height='auto';
  doMsg(t);
}

async function doMsg(text) {
  const apiKey=S.raw('st8_api_key');
  if(!apiKey) { openSettings(); return; }
  chatHistory.push({role:'user',content:text});
  S.set('unik_chat',chatHistory.slice(-20));
  const msgs=document.getElementById('chat-msgs');
  if(msgs) { msgs.innerHTML=renderMsgs(); scrollChat(); const th=document.createElement('div'); th.className='thinking'; th.id='thinking'; th.textContent='CHEFF думает...'; msgs.appendChild(th); scrollChat(); }
  try {
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,system:sysPrompt(),messages:chatHistory.slice(-12).map(m=>({role:m.role,content:m.content}))})});
    document.getElementById('thinking')?.remove();
    if(!resp.ok){const e=await resp.text();throw new Error(e.slice(0,100));}
    const data=await resp.json();
    const reply=data.content?.[0]?.text||(data.error?.type==='overloaded_error'?'Anthropic перегружен, подожди 30 секунд и попробуй снова.':'Ошибка ответа');
    chatHistory.push({role:'assistant',content:reply});
    S.set('unik_chat',chatHistory.slice(-20));
  } catch(e) {
    document.getElementById('thinking')?.remove();
    chatHistory.push({role:'assistant',content:e.message&&e.message.includes('529')?'Сервер перегружен. Подожди 30 секунд и отправь снова.':`Ошибка: ${e.message}`});
  }
  if(msgs){ msgs.innerHTML=renderMsgs(); scrollChat(); }
}

function memFb(type,idx) {
  const short=(chatHistory[idx]?.content||'').slice(0,80);
  if(type==='win') mem.wins.push(short);
  else if(type==='fail') mem.fails.push(short);
  else mem.notes.push(short);
  S.set('unik_cheff_memory',mem);
  alert(type==='win'?'✅ Добавлено в "Сработало"':type==='fail'?'❌ Добавлено в "Не работает"':'📝 Заметка сохранена');
}

async function genTTK() {
  const name = document.getElementById('ttk-inp').value.trim();
  if (!name) { alert('Введите название'); return; }
  const extra = (document.getElementById('ttk-extra') || {value:''}).value.trim();
  const apiKey = S.raw('st8_api_key');
  if (!apiKey) { alert('Нужен API ключ'); return; }
  const el = document.getElementById('ttk-res');
  el.innerHTML = '<div class="thinking">CHEFF разрабатывает ТТК по ГОСТ Р 31987-2012...</div>';
  try {
    const extraLine = extra ? '\nДополнительные требования: ' + extra : '';
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json', 'x-api-key': apiKey,
        'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001', max_tokens: 2000, system: sysPrompt(),
        messages: [{ role: 'user', content:
'Разработай полную ТТК для "' + name + '" для PP-доставки Unikfood Екатеринбург.' + extraLine + '\n'
+ 'Строго по ГОСТ Р 31987-2012. Без символов * # - [].\n\n'
+ 'ТЕХНИКО-ТЕХНОЛОГИЧЕСКАЯ КАРТА\n'
+ 'Наименование: ' + name + '\n'
+ 'Область применения: Unikfood, г. Екатеринбург\n\n'
+ '1. ТРЕБОВАНИЯ К СЫРЬЮ\n'
+ 'Каждый ингредиент с ГОСТ или ТУ. Пример: Куриное филе — ГОСТ Р 52702-2006, охлаждённое, 1 сорт.\n\n'
+ '2. РЕЦЕПТУРА (на 1 порцию)\n'
+ 'Таблица: Наименование | Брутто г | Потери хол.обр. % | Нетто г | Потери теп.обр. % | Выход г\n'
+ 'Потери по ГОСТ Р 31988-2012. Итого выход порции: ___ г\n\n'
+ '3. ТЕХНОЛОГИЧЕСКИЙ ПРОЦЕСС\n'
+ 'Пошагово с точными температурами и временем. Температура готовности внутри птицы/мяса не менее +72°C.\n\n'
+ '4. ТРЕБОВАНИЯ К ПОДАЧЕ И ХРАНЕНИЮ (СанПиН 2.3/2.4.3590-20)\n'
+ 'Температура подачи: ___°C\n'
+ 'Срок реализации: ___ ч\n'
+ 'Хранение охлаждённого: +2...+6°C, не более ___ ч\n\n'
+ '5. ПОКАЗАТЕЛИ КАЧЕСТВА\n'
+ 'Органолептические: внешний вид, цвет, консистенция, запах, вкус.\n'
+ 'Микробиологические: КМАФАнМ не более 1х10⁴ КОЕ/г (СанПиН 2.3.2.1078-01).\n\n'
+ '6. ПИЩЕВАЯ ЦЕННОСТЬ\n'
+ 'На 100 г: ___ ккал / Белки ___г / Жиры ___г / Углеводы ___г\n'
+ 'На порцию (___г): ___ ккал / Белки ___г / Жиры ___г / Углеводы ___г\n\n'
+ 'ЗАКЛЮЧЕНИЕ CHEFF:\n'
+ 'Соответствие PP-концепции: оценка\n'
+ 'Фудкост: ~___% (цены Екатеринбурга)\n'
+ 'Рекомендация: 1-2 совета с цифрами'
        }]
      })
    });
    const data = await resp.json();
    const fullText = data.content?.[0]?.text || '';

    const kcal    = +(fullText.match(/порцию[^:]*:\s*[\w\s]*?(\d{3,4})\s*ккал/i)||fullText.match(/ценность\s+(\d{3,4})\s*ккал/i)||[])[1]||0;
    const protein = +(fullText.match(/белки\s+(\d{1,3})[,.]?\d*\s*г/i)||[])[1]||0;
    const fat     = +(fullText.match(/жиры\s+(\d{1,3})[,.]?\d*\s*г/i)||[])[1]||0;
    const carbs   = +(fullText.match(/углеводы\s+(\d{1,3})[,.]?\d*\s*г/i)||[])[1]||0;
    const fc      = +(fullText.match(/фудкост[^%\d]*~?\s*(\d{1,2})/i)||[])[1]||0;
    const yldM    = fullText.match(/итого выход порции[:\s]*(\d{2,4})\s*г/i)||fullText.match(/порцию\s*\((\d{2,4})\s*г\)/i)||[];
    const yld     = yldM[1]||'';

    let warning = '';
    if (kcal && protein && fat && carbs) {
      const calc = protein*4 + fat*9 + carbs*4;
      if (Math.abs(calc - kcal) > kcal * 0.2)
        warning = 'КБЖУ не сходится: расчёт даёт ' + calc + 'ккал, указано ' + kcal + 'ккал — проверьте';
    }
    if (protein && protein < 20)
      warning += (warning?'\n':'') + 'Белок ' + protein + 'г — ниже PP-стандарта Unikfood (минимум 20г)';

    window._pendingTTK = {name, fc, yld: yld||'', tip: fullText.slice(0,120), kcal, protein, fat, carbs, fullText};

    el.innerHTML =
      '<div style="background:var(--surface2);border-radius:10px;padding:1rem;margin-bottom:.75rem;font-size:.79rem;line-height:1.7;color:var(--text-muted);white-space:pre-wrap;word-break:break-word;max-height:360px;overflow-y:auto;overflow-x:hidden;" id="ttk-full-text">' + H(fullText) + '</div>'
      + (warning ? '<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:7px;padding:.55rem .8rem;font-size:.77rem;color:#fca5a5;margin-bottom:.65rem;white-space:pre-line">' + H(warning) + '</div>' : '')
      + '<div class="gap-sm" style="margin-bottom:.65rem">'
      + (kcal ? '<span class="badge badge-accent">🔥 ' + kcal + 'ккал</span>' : '')
      + (protein ? '<span class="badge badge-' + (protein>=25?'green':protein>=20?'yellow':'red') + '">' + protein + 'г белка</span>' : '')
      + (fat ? '<span class="badge badge-accent">Ж: ' + fat + 'г</span>' : '')
      + (carbs ? '<span class="badge badge-accent">У: ' + carbs + 'г</span>' : '')
      + (fc ? '<span class="badge badge-' + (fc<=25?'green':fc<=32?'yellow':'red') + '">Фудкост ~' + fc + '%</span>' : '')
      + (yld ? '<span class="badge badge-accent">⚖️ ' + yld + 'г</span>' : '')
      + '</div>'
      + '<div class="gap-sm">'
      + '<button class="btn btn-accent" onclick="saveTTKFull()">💾 Сохранить ТТК</button>'
      + '<button class="btn btn-outline" onclick="navigator.clipboard.writeText(document.getElementById(\'ttk-full-text\').textContent).then(()=>alert(\'Скопировано!\'))">📋 Копировать</button>'
      + '<button class="btn btn-ghost" onclick="window.print()">🖨️ Печать</button>'
      + '</div>';
  } catch(e) {
    el.innerHTML = '<p style="color:#fca5a5">Ошибка: ' + e.message + '</p>';
  }
}

function saveTTK(name, fc, yld, tip) {
  ttkList.push({ name, foodcost: fc, yield: yld, tip: tip||'', kcal:0, protein:0, fat:0, carbs:0, fullText:'', status:'draft', at: new Date().toISOString() });
  S.set('unik_ttk', ttkList);
  document.getElementById('ttk-modal').classList.add('hidden');
  if (typeof refreshTTK === 'function') refreshTTK();
  else document.getElementById('panel-ttk').innerHTML = panelTTK();

function exportTTKPdf(i,mode){
  mode=mode||'cook';
  const t=ttkList[i]||{}; if(!t.fullText&&!t.name)return;
  const raw=t.fullText||'';
  const SKIP=/ПИЩЕВ|ОРГАНОЛЕПТ|ТРЕБОВАНИ.*СЫР|ПОКАЗАТЕЛ|ГОСТ|ХИМИЧЕСК/i;
  let html;
  if(mode==='full'){
    html='<pre style="white-space:pre-wrap;font-family:Arial;font-size:11px;color:#000">'+H(raw)+'</pre>';
  }else{
    const lines=raw.split('\n');
    const sections=[];
    let cur={hdr:'',body:[]};
    for(const line of lines){
      const tr=line.trim();
      const isHdr=tr.length>=4&&tr.length<80&&tr===tr.toUpperCase()&&/[А-ЯЁ]/.test(tr)&&!/^\d/.test(tr);
      if(isHdr){if(cur.body.some(l=>l.trim()))sections.push(cur);cur={hdr:tr,body:[]};}
      else cur.body.push(line);
    }
    if(cur.body.some(l=>l.trim()))sections.push(cur);
    let out='<div style="font-family:Arial,sans-serif;font-size:14px;color:#000">';
    out+='<h1 style="font-size:18px;text-align:center;margin-bottom:4px">'+H(t.name||'ТТК')+'</h1>';
    if(t.yield)out+='<p style="text-align:center;color:#555;font-size:13px;margin-top:0">Выход: '+H(t.yield)+'</p>';
    for(const sec of sections){
      if(SKIP.test(sec.hdr))continue;
      const bodyText=sec.body.join('\n').trim();
      if(!bodyText)continue;
      if(sec.hdr)out+='<h2 style="font-size:15px;margin-top:16px;margin-bottom:6px;border-bottom:2px solid #000;padding-bottom:3px">'+H(sec.hdr)+'</h2>';
      if(/РЕЦЕПТУР/i.test(sec.hdr)){
        const ingLines=sec.body.filter(l=>l.trim());
        const pipelines=ingLines.filter(l=>l.includes('|'));
        if(pipelines.length>=2){
          out+='<table style="width:100%;border-collapse:collapse;margin:8px 0">';
          for(const pl of pipelines){
            const cells=pl.split('|').map(c=>c.trim()).filter(c=>c);
            const isH=cells.some(c=>/ингредиент|брутто|нетто|выход|наименование/i.test(c));
            const tag=isH?'th':'td';
            const bg=isH?'background:#f0f0f0;font-weight:bold;':'';
            out+='<tr>'+cells.map(c=>`<${tag} style="${bg}border:1px solid #000;padding:6px 8px">${H(c)}</${tag}>`).join('')+'</tr>';
          }
          out+='</table>';
        }else{
          out+='<table style="width:100%;border-collapse:collapse;margin:8px 0">';
          out+='<tr><th style="border:1px solid #000;padding:6px 8px;background:#f0f0f0">Ингредиент</th><th style="border:1px solid #000;padding:6px 8px;background:#f0f0f0">Брутто г</th><th style="border:1px solid #000;padding:6px 8px;background:#f0f0f0">Нетто г</th><th style="border:1px solid #000;padding:6px 8px;background:#f0f0f0">Выход г</th></tr>';
          for(const il of ingLines){
            const m=il.match(/^(.+?)[–\-—:]\s*(\d+\.?\d*)\s*[\/|]?\s*(\d+\.?\d*)?\s*[\/|]?\s*(\d+\.?\d*)?/);
            if(m){out+='<tr><td style="border:1px solid #000;padding:5px 8px">'+H(m[1].trim())+'</td><td style="border:1px solid #000;padding:5px 8px;text-align:center">'+(m[2]||'')+'</td><td style="border:1px solid #000;padding:5px 8px;text-align:center">'+(m[3]||m[2]||'')+'</td><td style="border:1px solid #000;padding:5px 8px;text-align:center">'+(m[4]||m[3]||'')+'</td></tr>';}
            else if(il.trim())out+='<tr><td colspan="4" style="border:1px solid #000;padding:5px 8px">'+H(il.trim())+'</td></tr>';
          }
          out+='</table>';
        }
      }else{
        out+='<p style="white-space:pre-wrap;line-height:1.7;margin:0">'+H(bodyText)+'</p>';
      }
    }
    if(sections.length<=1)out+='<pre style="white-space:pre-wrap;font-size:13px">'+H(raw)+'</pre>';
    out+='</div>';
    html=out;
  }
  let style=document.getElementById('pdf-print-style');
  if(!style){style=document.createElement('style');style.id='pdf-print-style';document.head.appendChild(style);}
  style.textContent=mode==='cook'
    ?'@media print{body *{visibility:hidden}#pdf-content,#pdf-content *{visibility:visible}#pdf-content{position:absolute;left:0;top:0;width:100%;padding:20px;background:white;color:black;font-size:14px}@page{margin:15mm;size:A4}}'
    :'@media print{body *{visibility:hidden}#pdf-content,#pdf-content *{visibility:visible}#pdf-content{position:absolute;left:0;top:0;width:100%;padding:20px;background:white;color:black}@page{margin:15mm;size:A4}}';
  let div=document.getElementById('pdf-content');
  if(!div){div=document.createElement('div');div.id='pdf-content';document.body.appendChild(div);}
  div.innerHTML=html;
  window.print();
  setTimeout(()=>{div.remove();style.remove();},2000);
}

function validatePP(t){
  if(!t) return;
  const issues=[];
  if((t.protein||0)<25) issues.push('белок менее 25г ('+((t.protein||0))+'г)');
  const kcal=t.kcal||0;
  if(kcal&&(kcal<300||kcal>550)) issues.push('ккал '+kcal+' вне диапазона 300-550');
  const txt=(t.fullText||t.ingredients||t.name||'').toLowerCase();
  if(txt.match(/сахар|белая мука|майонез/)) issues.push('содержит запрещённые ингредиенты (сахар / белая мука / майонез)');
  if(issues.length) setTimeout(()=>alert('⚠️ PP-валидация "'+t.name+'":\n'+issues.join('\n')+'\n\nПроверьте рецептуру.'),200);
}

    t.carbs ? '<span class="badge badge-accent">У: '+t.carbs+'г</span>' : '',
    t.foodcost ? '<span class="badge badge-'+(t.foodcost<=25?'green':t.foodcost<=32?'yellow':'red')+'">Фудкост '+t.foodcost+'%</span>' : '',
  ].filter(Boolean).join(' ');
  document.getElementById('tvm-badges').innerHTML = badges;
  const _ft = t.fullText || '';
  document.getElementById('tvm-body').textContent = _ft ||
    'Полный текст не сохранён.\n\nКБЖУ: '+(t.kcal||'—')+'ккал / Б'+(t.protein||'—')+'г / Ж'+(t.fat||'—')+'г / У'+(t.carbs||'—')+'г\nФудкост: '+(t.foodcost||'—')+'%\nВыход: '+(t.yield||'—')+'\n\nCHEFF: '+(t.tip||'—');
  const _cheffBtns = document.getElementById('tvm-cheff-btns');
  if (_cheffBtns) {
    const _needsGen  = !_ft || _ft === 'Полный текст не сохранён';
    const _needsRef  = t.source === 'iiko' || _ft.includes('Технология: нажмите Доработать');
    if (_needsGen)  _cheffBtns.innerHTML = '<button class="btn btn-accent" onclick="genFullTextTTK('+i+')">🤖 Сгенерировать через CHEFF</button>';
    else if (_needsRef) _cheffBtns.innerHTML = '<button class="btn btn-accent" onclick="refineTTKwithCheff('+i+')">🤖 Доработать через CHEFF</button>';
    else _cheffBtns.innerHTML = '';
  }
  document.getElementById('tvm-approve').onclick = function() {
    ttkList[i].status = 'approved'; S.set('unik_ttk', ttkList);
    document.getElementById('ttk-view-modal').classList.add('hidden');
    refreshTTK(); alert('✅ ТТК утверждена');
  };
  document.getElementById('tvm-pdf-cook').onclick = function() { exportTTKPdf(i, 'cook'); };
  document.getElementById('tvm-pdf-full').onclick = function() { exportTTKPdf(i, 'full'); };
  modal.classList.remove('hidden');
}

function setRevSrc(btn,v){ document.querySelectorAll('.source-tabs .ct-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.getElementById('rev-src').value=v; }

function setRevTpl(t){ document.getElementById('rev-txt').value=REV_TPLS[t]||t; }
async function genReview(){
  const txt=document.getElementById('rev-txt').value.trim();
  const tone=document.getElementById('rev-tone').value;
  const src=document.getElementById('rev-src').value;
  if(!txt){alert('Вставьте текст отзыва');return;}

  if(!apiKey){alert('Нужен API ключ');return;}
  const el=document.getElementById('rev-res');
  el.innerHTML='<div class="thinking">CHEFF пишет ответ...</div>';

    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:300,system:sysPrompt(),messages:[{role:'user',content:`Ты управляющий "${config.name}". Напиши ответ на отзыв (платформа ${src}, тон: ${tone}, 1-3 предложения, без шаблонов, от первого лица): "${txt}"`}]})});

  } catch(e){ el.innerHTML=`<p style="color:#fca5a5">Ошибка: ${e.message}</p>`; }
}

function openAddAnalytics(){ document.getElementById('an-modal').classList.remove('hidden'); }
function saveAnalytics(){
  analyticsData.push({date:document.getElementById('an-date').value,revenue:+document.getElementById('an-rev').value||0,guests:+document.getElementById('an-guests').value||0,avgCheck:+document.getElementById('an-check').value||0});

let chartPeriod='day';
function setCP(btn,p){ document.querySelectorAll('#panel-analytics .chart-toggle .ct-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); chartPeriod=p; renderCharts(); }
function renderCharts(){
  const data=analyticsData.slice(-30);
  const dummy=!data.length;
  const labels=dummy?['Пн','Вт','Ср','Чт','Пт','Сб','Вс']:data.map(d=>d.date.slice(5));
  const revs=dummy?[120000,95000,180000,145000,220000,310000,280000]:data.map(d=>d.revenue);
  const fcs=dummy?[28,27,29,28,26,28,27]:data.map(d=>config.foodcost||28);
  const accent=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#d4af37';
  const opts={responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#666',font:{size:10}}},y:{ticks:{color:'#666',font:{size:10}},grid:{color:'rgba(255,255,255,.04)'}}}};
  const rCtx=document.getElementById('ch-rev');
  const fCtx=document.getElementById('ch-fc');
  if(!rCtx||!fCtx) return;
  if(charts.rev) charts.rev.destroy();
  if(charts.fc) charts.fc.destroy();
  const compareChk=document.getElementById('an-compare');
  const doCompare=compareChk&&compareChk.checked&&analyticsData.length>data.length;
  const prevData=doCompare?analyticsData.slice(-60,-30):[];
  const prevRevs=prevData.map(d=>d.revenue);
  const datasets=[{data:revs,borderColor:accent,backgroundColor:accent+'22',fill:true,tension:.4,pointRadius:3,pointBackgroundColor:accent,label:'Текущий период'}];
  if(doCompare&&prevRevs.length) datasets.push({data:prevRevs,borderColor:'#60a5fa',backgroundColor:'#60a5fa22',fill:false,tension:.4,pointRadius:3,pointBackgroundColor:'#60a5fa',borderDash:[4,4],label:'Прошлый период'});
  charts.rev=new Chart(rCtx,{type:'line',data:{labels,datasets},options:{...opts,plugins:{legend:{display:doCompare,labels:{color:'#888',font:{size:10}}}}}});

async function parsePrice(){
  const txt=document.getElementById('pp-txt').value.trim(); if(!txt){alert('Вставьте прайс');return;}
  const el=document.getElementById('pp-res');
  // Regex parsing first — no API needed for structured text
  const regexItems=[];
  txt.split('\n').forEach(line=>{
    line=line.trim(); if(!line)return;
    const m=line.match(/^(.+?)\s{2,}([\d\s.,]+)/)||line.match(/^(.+?)\s+([\d.,]+)\s*[₽рубр\.]/);
    if(m){
      const name=m[1].trim();
      const price=parseFloat(m[2].replace(/\s/g,'').replace(',','.'))||0;
      if(name&&price>0){
        let unit='кг';
        if(name.includes(', л')||name.includes(' л '))unit='л';
        if(name.includes(', шт')||name.includes(' шт'))unit='шт';
        if(name.includes(', г')||name.endsWith(' г'))unit='г';
        regexItems.push({product:name,unit,price,supplier:'',date:new Date().toISOString().slice(0,10)});
      }
    }
  });
  if(regexItems.length>0){
    regexItems.forEach(item=>purchases.push(item));
    S.set('unik_purchases',purchases);
    el.innerHTML=`<p style="color:#86efac">✅ Добавлено ${regexItems.length} позиций</p>`;
    setTimeout(()=>{document.getElementById('pp').classList.add('hidden');document.getElementById('panel-purchases').innerHTML=panelPurchases();},1500);
    return;
  }
  // Fall back to Claude API for unstructured text
  const apiKey=S.raw('st8_api_key'); if(!apiKey){alert('Введите API ключ в настройках');return;}
  const cleanText=txt.replace(/₽/g,'руб').replace(/[^\x20-\x7EЀ-ӿ\n\r\t]/g,' ').replace(/\\/g,'/').replace(/"/g,"'").trim().slice(0,4000);
  el.innerHTML='<div class="thinking">CHEFF разбирает прайс...</div>';
  try {
    const prompt='Разбери этот прайс и верни ТОЛЬКО валидный JSON массив без пояснений и markdown.\nФормат каждого элемента: {"name": "название товара", "unit": "кг/шт/л", "price": 123.45, "supplier": ""}\nПрайс:\n'+cleanText;
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:4000,system:'Отвечай только JSON массивом без пояснений и markdown.',messages:[{role:'user',content:prompt}]})});
    const data=await resp.json();
    const raw=(data.content?.[0]?.text||'[]').replace(/```json?/g,'').replace(/```/g,'').trim();
    const items=extractJSON(raw);

      if(item.name&&item.price){
        purchases.push({product:item.name||item.product||'',unit:item.unit||'кг',price:parseFloat(item.price)||0,supplier:item.supplier||'',date:new Date().toISOString().slice(0,10)});
      }
    });
    S.set('unik_purchases',purchases);
    el.innerHTML=`<p style="color:#86efac">✅ Добавлено ${items.length} позиций</p>`;
    setTimeout(()=>{ document.getElementById('pp').classList.add('hidden'); document.getElementById('panel-purchases').innerHTML=panelPurchases(); },1500);
  } catch(e){ el.innerHTML=`<p style="color:#fca5a5">Ошибка: ${e.message}</p>`; }

function importTTKFile(input){
  const file=input.files[0]; if(!file)return;
  const apiKey=S.raw('st8_api_key'); if(!apiKey){alert('Нужен API ключ');return;}
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    const r=new FileReader();
    r.onload=e=>{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
      const isIiko = rows.length>9 && String(rows[0]?.[0]||'').match(/^\d+$/) ||
        rows.some(r=>String(r[0]||'').includes('Технологическая карта'));
      if(isIiko){
        parseTTKFromIiko(rows, apiKey, file.name);
      } else {
        const hasStructure=rows.some(r=>r.some(c=>String(c||'').toLowerCase().includes('брутт')));
        if(hasStructure) parseTTKGeneric(rows, file.name);
        else parseTTKFromText(rows.map(r=>r.join('\t')).join('\n'), apiKey, file.name);
      }
    };
    r.readAsArrayBuffer(file);
  } else {
    const r=new FileReader();
    r.onload=e=>parseTTKFromText(e.target.result, apiKey, file.name);
    r.readAsText(file,'utf-8');
  }
  input.value='';
}

function parseTTKFromIiko(rows, apiKey, filename){
  const numParse = v => parseFloat(String(v||'').replace(/[^\d.,]/g,'').replace(',','.')) || 0;
  const cardNum = String(rows[0]?.[0]||'').trim();
  const name = String(rows[1]?.[0]||'Без названия').trim();
  const venue = (S.get('unik_config')||{}).name || 'Unikfood';

  // Find ingredient header row
  let hdrIdx = -1;
  for(let i=0;i<rows.length;i++){
    if(String(rows[i]?.[0]||'').toLowerCase().includes('наименование')){hdrIdx=i;break;}
  }
  const ingStart = hdrIdx>=0 ? hdrIdx+1 : 6;
  const ingRows = rows.slice(ingStart).filter(r=>{
    const n=String(r[0]||'').trim();
    return n && !n.toLowerCase().match(/^(выход|итого|масса|вес|калор|белк|жир|углевод|энергет|пищ)/);
  });

  // Yield
  let yieldVal = '';
  for(const r of rows){
    const c=String(r[0]||'').toLowerCase();
    if(c.includes('вес готового')||c.includes('выход')||c.includes('масса готового')){
      yieldVal=String(r[1]||r[2]||'').replace(/[^\d.,]/g,'').replace(',','.');break;
    }
  }

  // КБЖУ
  let kcal=0,protein=0,fat=0,carbs=0;
  for(const r of rows){
    const c=String(r[0]||'').toLowerCase();
    if(c.includes('калор')||c.includes('энергет')) kcal=numParse(r[1]||r[2]||r[3]||'');
    else if(c.includes('белк')) protein=numParse(r[1]||r[2]||r[3]||'');
    else if(c.includes('жир')) fat=numParse(r[1]||r[2]||r[3]||'');
    else if(c.includes('углевод')) carbs=numParse(r[1]||r[2]||r[3]||'');
  }

  // Technology — longest text block
  let technology = '';
  for(const r of rows){
    for(const cell of r){
      const s=String(cell||'').trim();
      if(s.length>technology.length && s.length>50 && !s.match(/^\d/) && !s.toLowerCase().includes('наименование')) technology=s;
    }
  }

  // ASCII table
  const C1=27,C2=8,C3=8,C4=8;
  const pad=(s,n)=>{const str=String(s||'').slice(0,n);return str+' '.repeat(Math.max(0,n-str.length));};
  const top='┌'+('─'.repeat(C1+2))+'┬'+('─'.repeat(C2+2))+'┬'+('─'.repeat(C3+2))+'┬'+('─'.repeat(C4+2))+'┐';
  const mid='├'+('─'.repeat(C1+2))+'┼'+('─'.repeat(C2+2))+'┼'+('─'.repeat(C3+2))+'┼'+('─'.repeat(C4+2))+'┤';
  const bot='└'+('─'.repeat(C1+2))+'┴'+('─'.repeat(C2+2))+'┴'+('─'.repeat(C3+2))+'┴'+('─'.repeat(C4+2))+'┘';
  const hdr='│ '+pad('Наименование',C1)+' │ '+pad('Брутто',C2)+' │ '+pad('Нетто',C3)+' │ '+pad('Выход',C4)+' │';
  const tableRows=ingRows.map(r=>'│ '+pad(r[0],C1)+' │ '+pad(r[1]||'',C2)+' │ '+pad(r[2]||'',C3)+' │ '+pad(r[3]||r[2]||'',C4)+' │').join('\n');

  const kbjuLine=(kcal||protein||fat||carbs)?`\nПИЩЕВАЯ ЦЕННОСТЬ на 100г:\nКалории: ${kcal} ккал | Белки: ${protein}г | Жиры: ${fat}г | Углеводы: ${carbs}г`:'';

  const fullText=`ТЕХНОЛОГИЧЕСКАЯ КАРТА № ${cardNum}\n${name}\n\nОбласть применения: ${venue}\n\nРЕЦЕПТУРА:\n${top}\n${hdr}\n${mid}\n${tableRows}\n${bot}\n\nВЫХОД ГОТОВОГО БЛЮДА: ${yieldVal||'—'} г\n\nТЕХНОЛОГИЯ ПРИГОТОВЛЕНИЯ:\n${technology||'Технология приготовления не указана в карте.'}${kbjuLine}`;

  const item={name,foodcost:0,yield:yieldVal?yieldVal+'г':'',kcal,protein,fat,carbs,
    ingredients:ingRows.map(r=>String(r[0]).trim()+' брутто:'+String(r[1]||'')+' нетто:'+String(r[2]||'')).join(', '),
    fullText,status:'draft',source:'iiko',at:new Date().toISOString()};
  ttkList.push(item);
  S.set('unik_ttk',ttkList);
  refreshTTK();
  const el=document.getElementById('kbju-res');
  if(el) el.innerHTML=`<p style="color:#86efac">✅ iiko карта "${name}" загружена (${ingRows.length} ингредиентов)</p>`;
  if(!technology) setTimeout(()=>genFullTextTTK(ttkList.length-1),600);
}

function parseTTKGeneric(rows, filename){
  const nameFromFile=filename.replace(/\.[^.]+$/,'');
  // Find name from first non-empty short cell
  let name=nameFromFile;
  for(const r of rows){
    const s=String(r[0]||'').trim();
    if(s && s.length<60 && s.length>2 && !s.toLowerCase().includes('наимен') && !s.match(/^\d+$/)){name=s;break;}
  }
  // Find header row with brutto/netto
  let bruttoCol=-1,nettoCol=-1,nameCol=0,hdrIdx=-1;
  for(let i=0;i<rows.length;i++){
    for(let c=0;c<rows[i].length;c++){
      const s=String(rows[i][c]||'').toLowerCase();
      if(s.includes('брутт')) bruttoCol=c;
      if(s.includes('нетт')) nettoCol=c;
      if(s.includes('наимен')) nameCol=c;
    }
    if(bruttoCol>=0||nettoCol>=0){hdrIdx=i;break;}
  }
  const ingRows=bruttoCol>=0&&hdrIdx>=0?rows.slice(hdrIdx+1).filter(r=>{
    const n=String(r[nameCol]||'').trim();
    return n&&!n.toLowerCase().includes('наимен')&&!n.toLowerCase().includes('итого');
  }):[];
  // Longest text = technology
  let technology='';
  for(const r of rows){
    for(const cell of r){
      const s=String(cell||'').trim();
      if(s.length>technology.length&&s.length>50&&!s.match(/^\d/)&&!s.toLowerCase().includes('наимен')) technology=s;
    }
  }
  const fullText=`ТЕХНОЛОГИЧЕСКАЯ КАРТА\n${name}\n\nРЕЦЕПТУРА:\n`+
    (ingRows.length?ingRows.map(r=>`${r[nameCol]} — брутто: ${r[bruttoCol]||'—'} нетто: ${r[nettoCol]||'—'}`).join('\n'):'Рецептура не распознана')+
    `\n\nТЕХНОЛОГИЯ ПРИГОТОВЛЕНИЯ:\n${technology||'Не указана'}`;
  const item={name,foodcost:0,yield:'',kcal:0,protein:0,fat:0,carbs:0,
    ingredients:ingRows.map(r=>String(r[nameCol]).trim()).join(', '),
    fullText,status:'draft',source:'generic',at:new Date().toISOString()};
  ttkList.push(item);
  S.set('unik_ttk',ttkList);
  refreshTTK();
  const el=document.getElementById('kbju-res');
  if(el) el.innerHTML=`<p style="color:#86efac">✅ Карта "${item.name}" загружена (generic, ${ingRows.length} ингр.)</p>`;
}

function loadPriceFile(input){
  const file=input.files[0]; if(!file)return;
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    const r=new FileReader();
    r.onload=function(e){
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
        let added=0;
        rows.forEach((row,idx)=>{
          if(idx<2)return;
          if(!row||!row[0]||String(row[0]).trim()==='')return;
          const name=String(row[0]).trim();
          const priceRaw=String(row[1]||'0').replace(/[^\d.,]/g,'').replace(',','.');
          const price=parseFloat(priceRaw)||0;
          if(name&&name.length>1){
            let unit='кг';
            if(name.toLowerCase().includes(', л')||name.toLowerCase().includes(' л,'))unit='л';
            if(name.toLowerCase().includes(', шт')||name.toLowerCase().includes(' шт'))unit='шт';
            if(name.toLowerCase().includes(', г')||name.toLowerCase().endsWith(' г'))unit='г';
            purchases.push({product:name,unit:unit,price:price,supplier:'',date:new Date().toISOString().slice(0,10)});
            added++;
          }
        });
        S.set('unik_purchases',purchases);
        document.getElementById('panel-purchases').innerHTML=panelPurchases();
        document.getElementById('pp').classList.add('hidden');
        alert('✅ Загружено '+added+' позиций из прайса');
      }catch(err){alert('Ошибка чтения файла: '+err.message);}
    };
    r.readAsArrayBuffer(file);
  } else {
    const r=new FileReader();
    r.onload=e=>{document.getElementById('pp-txt').value=e.target.result;};
    r.readAsText(file,'utf-8');
  }
  input.value='';
}

function _readFileAsText(file, cb){
  const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='xlsx'||ext==='xls'){
    const r=new FileReader();
    r.onload=e=>{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const texts=wb.SheetNames.map(sn=>{const ws=wb.Sheets[sn];return XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.filter(c=>c!=='').join('\t')).filter(r=>r.trim()).join('\n');}).join('\n---\n');
      cb(texts);
    };
    r.readAsArrayBuffer(file);
  } else {
    const r=new FileReader();
    r.onload=e=>{
      const buf=e.target.result;
      let text=new TextDecoder('utf-8',{fatal:false}).decode(buf);
      if((text.match(/�/g)||[]).length>5) text=new TextDecoder('windows-1251').decode(buf);
      cb(text);
    };
    r.readAsArrayBuffer(file);
  }
}
async function _parseViaCheff(text, systemPrompt, userPrompt){
  const apiKey=S.raw('st8_api_key'); if(!apiKey) throw new Error('Нужен API ключ');
  const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:2000,system:systemPrompt,messages:[{role:'user',content:userPrompt+'\n\nДанные:\n'+text.slice(0,6000)}]})});
  const data=await resp.json();
  const raw=data.content?.[0]?.text||'';
  const m=raw.match(/\[[\s\S]*\]/);
  return m?JSON.parse(m[0]):[];
}

function loadInvXls(input){
  const f=input.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try {
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
      let dataStart=0;
      for(let i=0;i<Math.min(rows.length,15);i++){
        const row=rows[i]; if(!row)continue;
        const c0=String(row[0]||'').toLowerCase();
        if(c0.match(/наимен|назван|продукт|товар/)){dataStart=i+1;break;}
        const hasNum=row.slice(1).some(c=>parseFloat(String(c||'').replace(',','.'))||false);
        if(hasNum&&c0.length>1){dataStart=i;break;}
      }
      let loaded=0;
      rows.slice(dataStart).forEach(row=>{
        if(!row||!row[0]||String(row[0]).trim()==='')return;
        const p=String(row[0]).trim();
        if(p.toLowerCase().match(/итого|всего|total/))return;
        const unit=String(row[1]||'кг').trim()||'кг';
        const norm=parseFloat(String(row[2]||'0').replace(/[^\d.,]/g,'').replace(',','.'))||0;
        const actual=parseFloat(String(row[3]||'0').replace(/[^\d.,]/g,'').replace(',','.'))||0;
        inventory.push({product:p,unit,norm,actual});loaded++;
      });
      S.set('unik_inventory',inventory);
      document.getElementById('panel-inventory').innerHTML=panelInventory();
      alert(`Загружено ${loaded} позиций`);
    } catch(e){ alert('Ошибка чтения файла'); }
  };
  r.readAsArrayBuffer(f);
}

    el.innerHTML = '<div class="thinking">CHEFF рассчитывает КБЖУ...</div>';

function renewSub(i){
  const s=subscriptions[i]; if(!s)return;
  const days=s.plan?.includes('5')?5:s.plan?.includes('10')?10:s.plan?.includes('20')?20:28;
  const base=s.endDate&&new Date(s.endDate)>new Date()?new Date(s.endDate):new Date();
  base.setDate(base.getDate()+days);
  s.endDate=base.toISOString().slice(0,10);
  s.status='active';
  S.set('unik_subs',subscriptions);
  document.getElementById('panel-subs').innerHTML=panelSubs();
  alert(`Подписка продлена до ${base.toLocaleDateString('ru')}`);
}

function renderCosts(){
  const el = document.getElementById('costs-summary'); if(!el) return;
  const rev = (config.revenue||0) * 1e6;
  const foodcostAmt = Math.round(rev * (config.foodcost||0) / 100);
  const rent     = costsData.rent     || 0;
  const salaries = costsData.salaries || 0;
  const utilities= costsData.utilities|| 0;
  const other    = costsData.other    || 0;
  const total    = foodcostAmt + rent + salaries + utilities + other;
  const profit   = rev - total;
  const margin   = rev > 0 ? (profit / rev * 100).toFixed(1) : '—';
  const pct = v => rev > 0 ? (v/rev*100).toFixed(1)+'%' : '—';
  const fmt = v => v.toLocaleString('ru')+'₽';
  const profitColor = profit >= 0 ? '#4ade80' : '#f87171';
  const rows = [
    ['🍅 Фудкост', fmt(foodcostAmt), pct(foodcostAmt), true],
    ['🏠 Аренда',  fmt(rent),        pct(rent),        false],
    ['👨‍🍳 Зарплаты',fmt(salaries),   pct(salaries),    false],
    ['💡 Коммун.',  fmt(utilities),   pct(utilities),   false],
    ['📦 Прочие',   fmt(other),       pct(other),       false],
  ];
  el.innerHTML = `
    <div class="card">
      <h3 style="margin-bottom:.9rem;font-size:.88rem">Структура расходов</h3>
      <table>
        <thead><tr><th>Статья</th><th>Сумма</th><th>% выручки</th></tr></thead>

          ${rows.map(([name,amt,p,auto])=>`<tr><td>${name}${auto?' <span style="font-size:.65rem;color:var(--text-muted)">(авто)</span>':''}</td><td style="text-align:right">${amt}</td><td style="text-align:right;color:var(--text-muted)">${p}</td></tr>`).join('')}
        </tbody>
      </table>
      <div style="border-top:1px solid var(--border);margin-top:.7rem;padding-top:.7rem">
        <div class="roi-row"><span class="font-bold">Итого расходы</span><span style="color:#f87171;font-weight:700">${fmt(total)}</span></div>
        <div class="roi-row"><span>Выручка</span><span style="color:var(--accent);font-weight:700">${fmt(rev)}</span></div>
        <div class="roi-row" style="margin-top:.4rem"><span class="font-bold" style="font-size:1rem">Прибыль</span><span style="color:${profitColor};font-weight:800;font-size:1rem">${fmt(profit)}</span></div>
        <div class="roi-row"><span class="text-muted text-sm">Маржа</span><span style="color:${profitColor}">${margin}%</span></div>
      </div>
    </div>`;

  const timeSave=Math.round(roiSliders.hours*22*hourRate);
  const woSave=Math.round((config.revenue||2)*1e6*(roiSliders.writeoff/100)*0.25);
  const ratingRev=Math.round(50*(config.avgCheck||1200));
  const commissionLoss=Math.round((config.revenue||0.8)*1e6*(roiSliders.commission/100));
  const total=techSave+timeSave+woSave+ratingRev;
  const payback=total>0?(65000/total).toFixed(1):'—';
  const rev=(config.revenue||0)*1e6;

  const prompts={brief:`Краткий отчёт для утреннего совещания (1 страница): ключевые показатели + 3 задачи на сегодня. ${ctx}`,full:`Подробный отчёт для управляющего: все данные, тренды, проблемы, рекомендации. ${ctx}`,owner:`Отчёт для собственника: P&L ключевые строки, главные метрики, выводы, риски. ${ctx}`};
  try {

    el.textContent=data.content?.[0]?.text||'Ошибка генерации';
  } catch(e){ el.textContent=`Ошибка: ${e.message}`; }

function saveIikoSettings(){

  if(url) S.setRaw('unik_iiko_url',url);

  if(pass) S.setRaw('unik_iiko_pass',pass);
  const el=document.getElementById('iiko-status'); if(el) el.textContent=url?'✅ Сохранено':'❌ Не настроено';
}
async function connectIiko(){
  const url=S.raw('unik_iiko_url')||''; const login=S.raw('unik_iiko_login')||''; const pass=S.raw('unik_iiko_pass')||'';
  if(!url||!login||!pass){alert('Укажите URL, логин и пароль iiko');return null;}
  const md5pass=SparkMD5.hash(pass);
  const resp=await fetch(`${url}/resto/api/auth?login=${encodeURIComponent(login)}&pass=${md5pass}&lang=ru`);
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const token=(await resp.text()).trim();
  if(!token) throw new Error('Пустой токен');
  S.setRaw('unik_iiko_token',token);
  return token;
}

async function loadIikoMenu(){
  const stEl=document.getElementById('iiko-status');
  if(stEl) stEl.textContent='Загружаю меню из iiko...';
  try {
    const token=await connectIiko(); if(!token) return;
    const url=S.raw('unik_iiko_url');
    const resp=await fetch(`${url}/resto/api/v2/entities/products/list?includeDeleted=false&key=${token}`);
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    const products=await resp.json();
    let count=0;
    for(const p of products){
      if(!p.name) continue;
      ttkList.push({
        name:p.name,
        fullText:'Наименование: '+p.name+'\nВыход: '+(p.weight||'—')+'г\nКалории: '+(p.energy||'—')+' ккал\nБелки: '+(p.protein||'—')+'г\nЖиры: '+(p.fat||'—')+'г\nУглеводы: '+(p.carbs||'—')+'г\nТехнология: нажмите Доработать через CHEFF',
        kcal:+(p.energy||0), protein:+(p.protein||0), fat:+(p.fat||0), carbs:+(p.carbs||0),
        yield:(p.weight?p.weight+'г':'—'), foodcost:0, status:'draft', source:'iiko', at:new Date().toISOString()
      });
      count++;
    }
    S.set('unik_ttk',ttkList);
    refreshTTK();
    if(stEl) stEl.textContent='✅ Подключено';
    alert('✅ Загружено '+count+' позиций из iiko');
  } catch(e) {
    if(stEl) stEl.textContent='❌ Ошибка подключения';
    alert('❌ Ошибка: '+e.message);
  }
}

async function sendTg(text){
  const token=S.raw('unik_tg_token'); const chat=S.raw('unik_tg_chat');
  if(!token||!chat) return false;
  try {
    const r=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:chat,text})});
    return r.ok;
  } catch { return false; }
}
function backupData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith('unik_')||k==='st8_api_key'))data[k]=localStorage.getItem(k);}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='unikfood-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function restoreData(input){
  const file=input.files[0]; if(!file)return;
  const r=new FileReader(); r.onload=e=>{
    try{const d=JSON.parse(e.target.result);Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,v));alert('✅ Восстановлено '+Object.keys(d).length+' ключей. Перезагрузка...');setTimeout(()=>location.reload(),1000);}
    catch{alert('Ошибка чтения файла');}
  }; r.readAsText(file);
  input.value='';
}
function delMem(type,i){ mem[type].splice(i,1); S.set('unik_cheff_memory',mem); openSettings(); }
function clearMem(){ if(!confirm('Очистить память CHEFF?'))return; mem.wins=[]; mem.fails=[]; mem.notes=[]; S.set('unik_cheff_memory',mem); openSettings(); }
async function updateApp(){
  const btn=event?.target; if(btn){btn.textContent='⏳ Обновляю...';btn.disabled=true;}
  try{
    if('caches' in window) await caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k))));
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  window.location.href=window.location.href.split('?')[0]+'?v='+Date.now();
}
function resetAll(){ if(!confirm('Сбросить ВСЕ данные?'))return; localStorage.clear(); location.reload(); }

  S.set('unik_staff', staffList);

  document.getElementById('panel-staff').innerHTML = panelStaff();
}

function importStaff(input) {
  const f = input.files[0]; if (!f) return;
  const apiKey = S.raw('st8_api_key');
  if (!apiKey) { alert('Нужен API ключ'); return; }
  input.value = '';

  const process = text => {
    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        system: 'Отвечай только JSON массивом без пояснений и markdown.',
        messages: [{
          role: 'user',
          content: 'Извлеки список сотрудников. JSON: [{name,role,phone}]. ' +
            'name=ФИО, role=должность/роль, phone=телефон или пусто. Максимум 100.\n\nДАННЫЕ:\n' + text.slice(0, 3000)
        }]
      })
    })
    .then(r => r.json())
    .then(data => {
      let raw = (data.content?.[0]?.text || '[]').replace(/```json?/g,'').replace(/```/g,'').trim();
      const items = JSON.parse(raw);
      if (!items.length) { alert('Сотрудники не найдены в файле'); return; }
      items.forEach(it => {
        if (it.name && !staffList.find(s => s.name === it.name)) {
          staffList.push({ name: it.name, role: it.role || '', phone: it.phone || '' });
        }
      });
      S.set('unik_staff', staffList);
      alert('✅ Импортировано ' + items.length + ' сотрудников из ' + f.name);
      document.getElementById('panel-staff').innerHTML = panelStaff();
    })
    .catch(e => alert('Ошибка: ' + e.message));
  };

  const ext = f.name.split('.').pop().toLowerCase();
  if (ext === 'xlsx' || ext === 'xls') {
    const r = new FileReader();
    r.onload = e => {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      process(XLSX.utils.sheet_to_json(ws, {header:1}).map(r => r.join('\t')).join('\n'));
    };
    r.readAsArrayBuffer(f);
  } else {
    const r = new FileReader();
    r.onload = e => process(e.target.result);
    r.readAsText(f, 'utf-8');
  }
}

let iikoConfig = S.get('iikoConfig') || { apiKey:'', enabled:false, autoSync:false, syncInterval:300000 };
let ikoLastSync = S.raw('iko_last_sync') || '';
let ikoAutoSyncIntervalId = null;

class IikoClient {
  constructor(apiKey) {
    this.apiKey = apiKey;
    this.baseUrl = 'https://api.iiko.ru/api/1';
    this.headers = {'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json'};
  }
  async getDishes() {
    try {
      const response = await fetch(`${this.baseUrl}/menu`, { headers: this.headers });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('iiko ошибка:', error);
      return { dishes: [] };
    }
  }
}

let ikoClient = null;

function initIiko(apiKey) {
  if (!apiKey) return false;
  ikoClient = new IikoClient(apiKey);
  iikoConfig = { ...iikoConfig, apiKey, enabled: true };
  S.set('iikoConfig', iikoConfig);
  return true;
}

async function syncAllIiko(showNotification = true) {
  if (!iikoConfig.enabled) return { success: false };
  try {
    const now = new Date().toISOString();
    S.setRaw('iko_last_sync', now);
    ikoLastSync = now;
    if (showNotification) showAmoNotification('✅ iiko синхронизирована', 'success', 3000);
    return { success: true };
  } catch (error) {
    if (showNotification) showAmoNotification(`❌ iiko ошибка: ${error.message}`, 'error', 3000);
    return { success: false };
  }
}

function initIikoOnLoad() {
  const saved = S.get('iikoConfig');
  if (saved && saved.apiKey) initIiko(saved.apiKey);
}

  `).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:2rem">Нет</td></tr>';

  return `<div class="sec-hd"><h2>🥘 Заготовки</h2><div class="gap-sm"><button class="btn btn-accent" onclick="openWorkpieceModal()">+ Создать</button><button class="btn btn-outline" onclick="loadWorkpiecesXls()">📂 Загрузить Excel</button></div></div>

function saveWorkpiece() {
  const name = document.getElementById('wp-name')?.value.trim();
  if (!name) return;
  workpieces.push({name, ingredients: document.getElementById('wp-ingr')?.value.split(',').map(i => i.trim()).filter(i => i) || [],

  closeWorkpieceModal();
  const p = document.getElementById('panel-workpieces');
  if (p) p.innerHTML = panelWorkpieces();

function delWorkpiece(i) { if (!confirm('Удалить?')) return; workpieces.splice(i, 1); S.set('unik_workpieces', workpieces);
  const p = document.getElementById('panel-workpieces');
  if (p) p.innerHTML = panelWorkpieces();
}

function loadWorkpiecesXls() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const allRows = XLSX.utils.sheet_to_json(ws, {raw:false, defval:'', header:1});
        const numParse = v => parseFloat(String(v||'').replace(/[^\d.,]/g,'').replace(',','.')) || 0;
        // Skip empty rows and header row (where row[0] is empty or contains "Назван")
        const dataRows = allRows.filter(r => {
          const c0 = String(r[0]||'').trim();
          return c0 && !c0.toLowerCase().includes('назван') && !c0.toLowerCase().includes('наимен');
        });
        let count = 0;
        dataRows.forEach(row => {
          const name = String(row[0]||'').trim();
          if (name) {
            workpieces.push({
              name,
              ingredients: [],
              yield: 0,
              cost: numParse(row[1]),
              shelf: 0,
              note: String(row[2]||'')
            });
            count++;
          }
        });
        S.set('unik_workpieces', workpieces);
        const p = document.getElementById('panel-workpieces');
        if (p) p.innerHTML = panelWorkpieces();
        alert(`✅ Загружено ${count} заготовок`);
      } catch (err) {
        showAmoNotification('❌ Ошибка чтения файла', 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

function importReviews(input) {
  const f = input.files[0]; if (!f) return;
  const apiKey = S.raw('st8_api_key'); if (!apiKey) { alert('Нужен API ключ'); return; }
  const reader = new FileReader();
  reader.onload = async e => {
    const text = e.target.result;
    const el = document.getElementById('rev-res');
    if (el) el.innerHTML = '<div class="thinking">CHEFF читает отзывы и готовит ответы...</div>';
    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001', max_tokens: 1500, system: sysPrompt(),
          messages: [{ role: 'user', content: 'Вот отзывы с Яндекс Еды. Для каждого напиши короткий ответ (1-2 предложения, тёплый тон, без шаблонов). Верни список: ОТЗЫВ: [...] / ОТВЕТ: [...]. Без Markdown.\n\n' + text.slice(0, 6000) }]
        })
      });
      const data = await resp.json();
      const reply = data.content?.[0]?.text || '';
      if (el) el.innerHTML = `<div class="report-area" style="min-height:auto;margin-bottom:.55rem">${H(reply)}</div><button class="btn btn-outline" onclick="navigator.clipboard.writeText(document.querySelector('#rev-res .report-area').innerText).then(()=>alert('Скопировано!'))">📋 Копировать всё</button>`;
    } catch(e) { if (el) el.innerHTML = '<p style="color:#fca5a5">Ошибка: ' + e.message + '</p>'; }
  };
  reader.readAsArrayBuffer(f);
  input.value = '';
}

function saveTemp() {
  const fridge = document.getElementById('tm-fr').value;
  const freezer = document.getElementById('tm-fz').value;
  const hot = document.getElementById('tm-h').value;
  if (!fridge && !freezer) { alert('Введите хотя бы одну температуру'); return; }
  // Проверяем нарушения
  const violations = [];
  if (fridge && (+fridge < 2 || +fridge > 6)) violations.push('холодильник ' + fridge + '°C (норма +2...+6°C)');
  if (freezer && +freezer > -18) violations.push('морозилка ' + freezer + '°C (норма ≤-18°C)');
  if (hot && +hot < 65) violations.push('горячее ' + hot + '°C (норма ≥65°C)');
  if (violations.length) alert('⚠️ НАРУШЕНИЕ СанПиН!\n' + violations.join('\n') + '\nЗафиксировано в журнале.');
  tempLog.push({
    date: document.getElementById('tm-d').value,
    time: document.getElementById('tm-t').value,
    fridge, freezer, hot,
    who: document.getElementById('tm-who').value,
    note: document.getElementById('tm-n').value
  });
  S.set('unik_temp', tempLog);

}

function loadEquipmentXls() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''});
        let dataStart = 0;
        for(let i=0;i<rows.length;i++){const c=String(rows[i]?.[0]||'').trim();if(c&&!c.toLowerCase().match(/назван|наимен/)){dataStart=i;break;}else if(c){dataStart=i+1;break;}}
        let count = 0;
        rows.slice(dataStart).forEach(row => {
          const name = String(row[0]||'').trim();
          if (name) {
            equipment.push({
              name,
              type: String(row[1]||'вспомогательное'),
              containers: String(row[2]||'').split(',').map(c => c.trim()).filter(c => c),
              specs: String(row[3]||'')
            });
            count++;
          }
        });
        S.set('unik_equipment', equipment);
        const p = document.getElementById('panel-equipment');
        if (p) p.innerHTML = panelEquipment();
        showAmoNotification(`✅ Загружено ${count} единиц оборудования`, 'success');
      } catch (err) {
        showAmoNotification('❌ Ошибка чтения файла', 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

        const p = document.getElementById('panel-equipment');
        if (p) p.innerHTML = panelEquipment();
        showAmoNotification(`✅ Загружено ${count} гастроемкостей`, 'success');
      } catch (err) {
        showAmoNotification('❌ Ошибка чтения файла', 'error');
      }
    };
    reader.readAsArrayBuffer(file);
  };
  input.click();
}

function uploadTtkFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.xlsx,.xls,.csv,.txt';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        let ttkText = '';
        if (file.name.endsWith('.txt') || file.name.endsWith('.csv')) {
          ttkText = ev.target.result;
        } else {
          const wb = XLSX.read(ev.target.result, { type: 'array' });
          const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
          ttkText = rows.map(r => Object.values(r).join(' | ')).join('\n');
        }
        const msg = `Вот мне ТТК для обработки:\n\n${ttkText}\n\nПожалуйста разберись, сделай анализ и дай рекомендации.`;
        doMsg(msg);
        showAmoNotification('✅ ТТК загружена, CHEFF анализирует...', 'success');
      } catch (err) {
        showAmoNotification('❌ Ошибка чтения файла', 'error');
      }
    };
    if (file.name.endsWith('.txt') || file.name.endsWith('.csv')) {
      reader.readAsText(file);
    } else {
      reader.readAsArrayBuffer(file);
    }
  };
  input.click();
}

/**

 * AmoCRM INTEGRATION MODULE v2.0 - С ПОЛНЫМ АВТОМАТОМ

// ── STATE ──
let amoConfig = S.get('amo_config') || { apiKey:'', subdomain:'', enabled:false, autoSync:false, syncInterval:300000 };
let amoContacts = S.get('amo_contacts') || [];
let amoDeals = S.get('amo_deals') || [];
let amoLastSync = S.raw('amo_last_sync') || '';
let amoSyncLog = S.get('amo_sync_log') || [];
let amoAutoSyncIntervalId = null;

// ──────────────────────────────────────────────────────────────
// AMO CRM API CLASS
// ──────────────────────────────────────────────────────────────

class AmoCRMClient {
  constructor(apiKey, subdomain) {
    this.apiKey = apiKey;
    this.subdomain = subdomain;
    this.baseUrl = `https://${subdomain}.amocrm.ru/api/v4`;
    this.headers = {
      'Authorization': `Bearer ${apiKey}`,
      'Content-Type': 'application/json'
    };
  }

  async getContacts(limit = 100, offset = 0) {
    try {
      const response = await fetch(
        `${this.baseUrl}/contacts?limit=${limit}&offset=${offset}&with=leads`,
        { headers: this.headers }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Ошибка получения контактов:', error);
      return { _embedded: { contacts: [] } };
    }
  }

  async getDeals(limit = 100, offset = 0) {
    try {
      const response = await fetch(
        `${this.baseUrl}/leads?limit=${limit}&offset=${offset}&with=contacts,catalog_elements`,
        { headers: this.headers }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Ошибка получения сделок:', error);
      return { _embedded: { leads: [] } };
    }
  }

  async createDeal(dealData) {
    try {
      const response = await fetch(
        `${this.baseUrl}/leads`,
        {
          method: 'POST',
          headers: this.headers,
          body: JSON.stringify({
            name: dealData.name || 'Новый заказ',
            price: dealData.price || 0,
            responsible_user_id: dealData.responsible_user_id || null,
            custom_fields_values: dealData.custom_fields || [],
            _embedded: {
              contacts: dealData.contacts ? [{ id: dealData.contacts.id }] : []
            }
          })
        }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Ошибка создания сделки:', error);
      return null;
    }
  }

  async updateDeal(dealId, dealData) {
    try {
      const response = await fetch(
        `${this.baseUrl}/leads/${dealId}`,
        {
          method: 'PATCH',
          headers: this.headers,
          body: JSON.stringify({
            name: dealData.name,
            price: dealData.price,
            status_id: dealData.status_id,
            custom_fields_values: dealData.custom_fields || []
          })
        }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Ошибка обновления сделки:', error);
      return null;
    }
  }

  async getNotes(entityType, entityId) {
    try {
      const response = await fetch(
        `${this.baseUrl}/${entityType}/${entityId}/notes`,
        { headers: this.headers }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Ошибка получения примечаний:', error);
      return { _embedded: { notes: [] } };
    }
  }

  async addNote(entityType, entityId, noteText) {
    try {
      const response = await fetch(
        `${this.baseUrl}/${entityType}/${entityId}/notes`,
        {
          method: 'POST',
          headers: this.headers,
          body: JSON.stringify({
            note_type: 'common',
            text: noteText
          })
        }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Ошибка добавления примечания:', error);
      return null;
    }
  }

  async getPipelines() {
    try {
      const response = await fetch(
        `${this.baseUrl}/leads/pipelines`,
        { headers: this.headers }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Ошибка получения воронок:', error);
      return { _embedded: { pipelines: [] } };
    }
  }
}

let amoClient = null;

// ──────────────────────────────────────────────────────────────
// NOTIFICATION SYSTEM
// ──────────────────────────────────────────────────────────────

function showAmoNotification(message, type = 'info', duration = 3000) {
  const id = 'amo-notif-' + Date.now();
  const colors = {
    success: { bg: 'rgba(34,197,94,.1)', border: '#86efac', text: '#86efac' },
    error: { bg: 'rgba(239,68,68,.1)', border: '#fca5a5', text: '#fca5a5' },
    info: { bg: 'rgba(200,245,60,.1)', border: '#C8F53C', text: '#C8F53C' },
    warning: { bg: 'rgba(234,179,8,.1)', border: '#fde047', text: '#fde047' }
  };
  
  const c = colors[type] || colors.info;
  
  const el = document.createElement('div');
  el.id = id;
  el.style.cssText = `
    position: fixed;
    top: 20px;
    right: 20px;
    background: ${c.bg};
    border: 1px solid ${c.border};
    color: ${c.text};
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    z-index: 10000;
    animation: slideIn 0.3s ease;
  `;
  el.textContent = message;
  
  document.body.appendChild(el);
  
  setTimeout(() => {
    el.style.animation = 'slideOut 0.3s ease';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

// CSS для анимаций
if (!document.getElementById('amo-styles')) {
  const style = document.createElement('style');
  style.id = 'amo-styles';
  style.textContent = `
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }
  `;
  document.head.appendChild(style);
}

// ──────────────────────────────────────────────────────────────
// LOGGING SYSTEM
// ──────────────────────────────────────────────────────────────

function logAmoSync(status, message, contactsCount = 0, dealsCount = 0) {
  const timestamp = new Date().toISOString();
  const logEntry = {
    timestamp,
    status, // 'success', 'error', 'warning'
    message,
    contactsCount,
    dealsCount
  };
  
  amoSyncLog.push(logEntry);
  
  // Храним последние 50 записей
  if (amoSyncLog.length > 50) {
    amoSyncLog.shift();
  }
  
  S.set('amo_sync_log', amoSyncLog);
  console.log('[amoCRM Sync]', status.toUpperCase(), message);
}

function getAmoSyncStats() {
  if (!amoSyncLog.length) return null;
  
  const successful = amoSyncLog.filter(l => l.status === 'success').length;
  const failed = amoSyncLog.filter(l => l.status === 'error').length;
  const lastSync = amoSyncLog[amoSyncLog.length - 1];
  
  return { successful, failed, lastSync };
}

// ──────────────────────────────────────────────────────────────
// SYNC FUNCTIONS WITH NOTIFICATIONS
// ──────────────────────────────────────────────────────────────

function initAmoCRM(apiKey, subdomain) {
  if (!apiKey || !subdomain) {
    console.warn('amoCRM не настроена');
    return false;
  }
  amoClient = new AmoCRMClient(apiKey, subdomain);
  amoConfig = { ...amoConfig, apiKey, subdomain, enabled: true };
  S.set('amo_config', amoConfig);
  return true;
}

async function syncAmoContacts() {
  if (!amoClient) return 0;
  try {
    const response = await amoClient.getContacts(100);
    if (response._embedded && response._embedded.contacts) {
      amoContacts = response._embedded.contacts.map(c => ({
        id: c.id,
        name: c.name,
        phone: c.custom_fields_values?.find(f => f.field_id === 205381)?.values?.[0]?.value || '',
        email: c.custom_fields_values?.find(f => f.field_id === 205384)?.values?.[0]?.value || '',
        source: c.source_id || null,
        createdAt: new Date(c.created_at * 1000),
        updatedAt: new Date(c.updated_at * 1000)
      }));
      S.set('amo_contacts', amoContacts);
      return amoContacts.length;
    }
  } catch (error) {
    console.error('Ошибка синхронизации контактов:', error);
  }
  return 0;
}

async function syncAmoDeals() {
  if (!amoClient) return 0;
  try {
    const response = await amoClient.getDeals(100);
    if (response._embedded && response._embedded.leads) {
      amoDeals = response._embedded.leads.map(d => ({
        id: d.id,
        name: d.name,
        price: d.price || 0,
        statusId: d.status_id,
        pipelineId: d.pipeline_id,
        contactId: d._embedded?.contacts?.[0]?.id || null,
        createdAt: new Date(d.created_at * 1000),
        updatedAt: new Date(d.updated_at * 1000),
        customFields: d.custom_fields_values || []
      }));
      S.set('amo_deals', amoDeals);
      return amoDeals.length;
    }
  } catch (error) {
    console.error('Ошибка синхронизации сделок:', error);
  }
  return 0;
}

async function syncAllAmo(showNotification = true) {
  if (!amoConfig.enabled) {
    if (showNotification) {
      showAmoNotification('❌ amoCRM не подключена', 'warning');
    }
    return { contacts: 0, deals: 0, success: false };
  }

  try {
    const contacts = await syncAmoContacts();
    const deals = await syncAmoDeals();
    
    const now = new Date().toISOString();
    S.setRaw('amo_last_sync', now);
    amoLastSync = now;
    
    const message = `✅ Синхронизировано: ${contacts} контактов, ${deals} сделок`;
    logAmoSync('success', message, contacts, deals);
    
    if (showNotification) {
      showAmoNotification(message, 'success', 5000);
    }
    
    loadAmoContactsIntoApp();
    loadAmoDealsIntoAnalytics();
    
    return { contacts, deals, success: true };
  } catch (error) {
    const errorMsg = `❌ Ошибка синхронизации: ${error.message}`;
    logAmoSync('error', errorMsg);
    
    if (showNotification) {
      showAmoNotification(errorMsg, 'error', 5000);
    }
    
    return { contacts: 0, deals: 0, success: false };
  }
}

// ──────────────────────────────────────────────────────────────
// AUTO SYNC MANAGEMENT
// ──────────────────────────────────────────────────────────────

function startAutoSync() {
  if (amoAutoSyncIntervalId) {
    clearInterval(amoAutoSyncIntervalId);
  }
  
  if (!amoConfig.enabled) {
    console.warn('Auto sync не может стартовать — amoCRM не подключена');
    return;
  }
  
  // Первая синхронизация сразу
  syncAllAmo(false);
  
  // Потом каждый N секунд
  amoAutoSyncIntervalId = setInterval(() => {
    syncAllAmo(false); // без уведомления чтобы не спамить
    console.log('[amoCRM] Auto sync выполнена:', new Date().toLocaleTimeString('ru'));
  }, amoConfig.syncInterval);
  
  console.log(`[amoCRM] Auto sync запущена: каждые ${amoConfig.syncInterval / 1000} секунд`);
  showAmoNotification(`✅ Автосинхронизация включена (каждые ${amoConfig.syncInterval / 1000}с)`, 'success');
}

function stopAutoSync() {
  if (amoAutoSyncIntervalId) {
    clearInterval(amoAutoSyncIntervalId);
    amoAutoSyncIntervalId = null;
    console.log('[amoCRM] Auto sync остановлена');
    showAmoNotification('❌ Автосинхронизация отключена', 'warning');
  }
}

function setAutoSyncInterval(milliseconds) {
  amoConfig.syncInterval = milliseconds;
  S.set('amo_config', amoConfig);
  
  // Перезапустить если она включена
  if (amoConfig.autoSync) {
    stopAutoSync();
    startAutoSync();
  }
}

// ──────────────────────────────────────────────────────────────
// PULL DATA INTO APP
// ──────────────────────────────────────────────────────────────

function loadAmoContactsIntoApp() {
  if (!amoContacts.length) return;

  amoContacts.forEach(contact => {
    const exists = subscriptions.find(s => s.phone === contact.phone && s.name === contact.name);
    if (!exists && contact.phone) {
      subscriptions.push({
        name: contact.name || 'Без имени',
        phone: contact.phone,
        plan: 'PP доставка',
        price: 0,
        startDate: contact.createdAt.toISOString().slice(0,10),
        endDate: '',
        goal: '',
        kcalTarget: 0,
        allergy: '',
        status: 'active',
        amoId: contact.id
      });
    }
  });
  S.set('unik_subs', subscriptions);
}

function loadAmoDealsIntoAnalytics() {
  if (!amoDeals.length) return;

  amoDeals.forEach(deal => {
    const exists = analyticsData.find(a => a.amoId === deal.id);
    if (!exists) {
      analyticsData.push({
        date: deal.createdAt.toISOString().slice(0,10),
        revenue: deal.price,
        guests: 1,
        avgCheck: deal.price,
        amoId: deal.id,
        amoName: deal.name
      });
    }
  });
  S.set('unik_analytics', analyticsData);
}

// ──────────────────────────────────────────────────────────────
// PUSH DATA TO AMO
// ──────────────────────────────────────────────────────────────

async function pushOrderToAmo(orderData) {
  if (!amoClient) return false;

  try {
    const deal = await amoClient.createDeal({
      name: orderData.name || `Заказ от ${new Date().toLocaleDateString('ru')}`,
      price: orderData.price || 0,
      contacts: orderData.contactId ? { id: orderData.contactId } : null,
      custom_fields: orderData.customFields || []
    });

    if (deal && deal.id) {
      amoDeals.push({
        id: deal.id,
        name: deal.name,
        price: deal.price,
        statusId: deal.status_id,
        contactId: orderData.contactId,
        createdAt: new Date(),
        updatedAt: new Date()
      });
      S.set('amo_deals', amoDeals);
      
      logAmoSync('success', `Заказ отправлен в amoCRM: ${deal.name}`);
      showAmoNotification(`✅ Заказ отправлен в amoCRM`, 'success');
      
      return deal.id;
    }
  } catch (error) {
    logAmoSync('error', `Ошибка отправки заказа: ${error.message}`);
    showAmoNotification(`❌ Ошибка при отправке заказа`, 'error');
  }
  return false;
}

async function updateOrderStatusInAmo(dealId, statusId) {
  if (!amoClient) return false;

  try {
    const result = await amoClient.updateDeal(dealId, {
      name: `Заказ #${dealId}`,
      price: 0,
      status_id: statusId
    });
    
    if (result) {
      logAmoSync('success', `Статус заказа обновлён: #${dealId}`);
      showAmoNotification(`✅ Статус обновлён`, 'success');
    }
    return result !== null;
  } catch (error) {
    logAmoSync('error', `Ошибка обновления статуса: ${error.message}`);
    showAmoNotification(`❌ Ошибка обновления статуса`, 'error');
  }
  return false;
}

async function addNoteToAmoDeal(dealId, noteText) {
  if (!amoClient) return false;

  try {
    const result = await amoClient.addNote('leads', dealId, noteText);
    if (result) {
      logAmoSync('success', `Примечание добавлено к заказу #${dealId}`);
    }
    return result !== null;
  } catch (error) {
    logAmoSync('error', `Ошибка добавления примечания: ${error.message}`);
  }
  return false;
}

// ──────────────────────────────────────────────────────────────
// UI CONTROLS
// ──────────────────────────────────────────────────────────────

function openAmoSettings() {
  const key = prompt('Введите API ключ amoCRM:', amoConfig.apiKey || '');
  if (!key) return;

  const subdomain = prompt('Введите поддомен (без .amocrm.ru):', amoConfig.subdomain || '');
  if (!subdomain) return;

  if (initAmoCRM(key, subdomain)) {
    showAmoNotification('✅ amoCRM подключена!', 'success');
    syncAllAmo().then(result => {
      loadAmoContactsIntoApp();
      loadAmoDealsIntoAnalytics();
      if (document.getElementById('panel-subs')) {
        document.getElementById('panel-subs').innerHTML = panelSubs();
      }
      if (document.getElementById('panel-analytics')) {
        document.getElementById('panel-analytics').innerHTML = panelAnalytics();
      }
    });
  } else {
    showAmoNotification('❌ Ошибка подключения', 'error');
  }
}

async function manualSyncAmo() {
  if (!amoConfig.enabled) {
    showAmoNotification('❌ amoCRM не подключена', 'warning');
    return;
  }
  await syncAllAmo(true);
}

function toggleAutoSync() {
  amoConfig.autoSync = !amoConfig.autoSync;
  S.set('amo_config', amoConfig);
  
  if (amoConfig.autoSync) {
    startAutoSync();
  } else {
    stopAutoSync();
  }
}

function openAmoSyncStats() {
  const stats = getAmoSyncStats();
  
  if (!stats) {
    alert('История синхронизации пуста');
    return;
  }
  
  const lastTime = new Date(stats.lastSync.timestamp).toLocaleString('ru');
  const message = `📊 Статистика синхронизации:
  
✅ Успешных: ${stats.successful}
❌ Ошибок: ${stats.failed}

Последняя: ${lastTime}
Сообщение: ${stats.lastSync.message}
Контактов: ${stats.lastSync.contactsCount}
Сделок: ${stats.lastSync.dealsCount}`;
  
  alert(message);
}

// ──────────────────────────────────────────────────────────────
// AUTO-INIT НА ЗАГРУЗКЕ
// ──────────────────────────────────────────────────────────────

function initAmoOnLoad() {
  const saved = S.get('amo_config');
  if (saved && saved.apiKey && saved.subdomain) {
    initAmoCRM(saved.apiKey, saved.subdomain);
    amoContacts = S.get('amo_contacts') || [];
    amoDeals = S.get('amo_deals') || [];
    amoLastSync = S.raw('amo_last_sync') || '';
    amoSyncLog = S.get('amo_sync_log') || [];

    if (amoContacts.length) loadAmoContactsIntoApp();
    if (amoDeals.length) loadAmoDealsIntoAnalytics();
    
    // Если была включена автосинхронизация — запустить её
    if (saved.autoSync) {
      setTimeout(startAutoSync, 1000);
    }
  }
}

initAmoOnLoad();

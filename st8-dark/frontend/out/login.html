<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST8 Dark Intelligence · Login</title>
<style>
:root{--accent:#D4A017;--bg:#0A0F1A;--surface:#111827;--text:#E2E8F0;--muted:#475569}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.login{max-width:360px;width:100%;padding:2rem}
h1{color:var(--accent);font-weight:800;margin-bottom:.5rem;font-size:1.5rem}
p{color:var(--muted);margin-bottom:1.5rem;font-size:.85rem}
input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:.95rem;outline:none;margin-bottom:1rem}
input:focus{border-color:var(--accent)}
.btn{width:100%;background:var(--accent);color:#0F0A1A;border:none;padding:.85rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;font-size:.95rem}
.btn:hover{filter:brightness(1.1)}
</style>
</head>
<body>
<div class="login">
<h1>ST8 Dark Intelligence</h1>
<p>Введите Anthropic API ключ для доступа к CHEFF AI</p>
<input type="password" id="api-key" placeholder="sk-ant-api03-..." onkeydown="if(event.key==='Enter'){login()}">
<button class="btn" onclick="login()">Войти</button>
</div>
<script>
function login(){const k=document.getElementById('api-key').value;if(k.startsWith('sk-ant-')){localStorage.setItem('st8_api_key',k);window.location.href='index.html'}else alert('Неверный API ключ')}
if(localStorage.getItem('st8_api_key'))window.location.href='index.html';
</script>
</body>
</html>
